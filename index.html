<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бахтияр | Frontend Developer</title>
    <style>
        :root {
            --bg: #E0E5EC;
            --accent: #0033FF; /* Яркий синий акцент */
            --text: #1A1A1A;
            --shadow-dark: #b8bfc9;
            --shadow-light: #ffffff;
        }

        body {
            margin: 0; padding: 0; background: var(--bg);
            color: var(--text); font-family: 'Inter', sans-serif;
            overflow-x: hidden; min-height: 100vh;
        }

        /* ЖИВОЙ ФОН */
        .bg-blobs { position: fixed; inset: 0; z-index: -1; }
        .blob { 
            position: absolute; background: var(--accent); 
            filter: blur(100px); opacity: 0.12; border-radius: 50%;
            animation: move 25s infinite alternate ease-in-out; 
        }
        @keyframes move { from { transform: translate(-5%, -5%); } to { transform: translate(25%, 15%); } }

        /* СЕТКА СТРОГО ПО ТВОЕМУ СКЕЛЕТУ */
        .container {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            grid-template-rows: 90px 170px auto 100px;
            gap: 30px; max-width: 1400px; margin: 0 auto; padding: 20px 40px;
        }

        /* КАРТОЧКИ (НЕОМОРФИЗМ + СИНИЙ АКЦЕНТ) */
        .card {
            background: var(--bg); border-radius: 35px;
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            padding: 25px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.5);
            position: relative;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 18px 18px 36px var(--shadow-dark); }
        .card::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 40%; height: 4px; background: var(--accent); border-radius: 0 0 10px 10px; opacity: 0; transition: 0.3s; }
        .card:hover::before { opacity: 1; }

        /* ВЕРХНИЕ КНОПКИ */
        .btn-top { width: 160px; height: 60px; font-weight: 800; cursor: pointer; letter-spacing: 1px; }
        .login { grid-column: 1; justify-self: start; }
        .theme { grid-column: 3; justify-self: end; }

        /* СТАТИСТИКА (SVG ИКОНКИ ВНУТРИ) */
        .stat-icon { width: 45px; height: 45px; fill: var(--accent); margin-bottom: 10px; }

        /* КОНТЕНТ */
        .feedback { grid-column: 1 / 3; grid-row: 3; align-items: flex-start; min-height: 450px; padding: 40px; }
        .arsenal { grid-column: 3; grid-row: 3; background: linear-gradient(145deg, #e6e9ef, #d1d9e6); }

        /* ФОРМА */
        input, textarea {
            width: 100%; background: var(--bg); border: none; padding: 20px;
            border-radius: 20px; margin: 15px 0;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            box-sizing: border-box; font-size: 16px; color: var(--text);
        }
        .send-btn {
            background: var(--accent); color: white; border: none; padding: 18px 45px;
            border-radius: 22px; font-weight: 800; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 51, 255, 0.3); margin-top: 10px;
        }
        .send-btn:hover { filter: brightness(1.2); transform: scale(1.05); }

        /* ФУТЕР */
        .footer { grid-column: 1 / 4; grid-row: 4; display: flex; justify-content: space-between; align-items: center; }
        .socials a {
            display: inline-flex; align-items: center; justify-content: center;
            width: 55px; height: 55px; border-radius: 18px; background: var(--bg);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            margin-left: 15px; transition: 0.3s;
        }
        .socials a:hover { transform: translateY(-5px); color: var(--accent); }
        .socials img { width: 32px; }
    </style>
</head>
<body>

<div class="bg-blobs">
    <div class="blob" style="width: 600px; height: 600px; top: -10%; left: -5%;"></div>
    <div class="blob" style="width: 450px; height: 450px; bottom: 5%; right: 10%; background: #00CCFF;"></div>
</div>

<div class="container">
    <div class="card btn-top login">РЕГИСТРАЦИЯ</div>
    <div class="card btn-top theme" onclick="document.body.classList.toggle('dark-mode')">ТЕМА</div>

    <div class="card" style="grid-row: 2;">
        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <strong>ОТКЛИК</strong>
    </div>
    <div class="card" style="grid-row: 2;">
        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 2L1 7l11 5 11-5-11-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <strong>СТЭК</strong>
    </div>
    <div class="card" style="grid-row: 2;">
        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/></svg>
        <strong>ДИНАМИКА</strong>
    </div>

    <div class="card feedback">
        <h2 style="color: var(--accent); margin: 0 0 10px 0;">ОСТАВИТЬ ОТЗЫВ</h2>
        <input type="text" placeholder="Как вас зовут?">
        <textarea placeholder="Ваш отзыв здесь..." rows="5"></textarea>
        <button class="send-btn">ОТПРАВИТЬ СООБЩЕНИЕ</button>
    </div>

    <div class="card arsenal">
        <h2 style="color: var(--accent);">АРСЕНАЛ</h2>
        <div style="text-align: left; font-weight: 600; line-height: 2;">
            <div>• Python / Flask</div>
            <div>• Modern UI/UX</div>
            <div>• JavaScript ES6</div>
            <div>• GitHub Pages</div>
        </div>
    </div>

    <div class="footer">
        <div class="card" style="width: 200px; height: 60px; font-weight: 900;">ОБО МНЕ</div>
        <div class="socials">
            <a href="#"><img src="assets/img/wa.png" alt="WA"></a>
            <a href="#"><img src="assets/img/inst.png" alt="Inst"></a>
            <a href="#"><img src="assets/img/tg.png" alt="TG"></a>
        </div>
    </div>
</div>

</body>
</html>
