<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Бахтияр</title>
    <style>
        :root {
            --bg: #E0E5EC;
            --accent: #0033FF; /* Тот самый синий из наброска */
            --text: #1A1A1A;
            --shadow-dark: #b8bfc9;
            --shadow-light: #ffffff;
        }

        body {
            margin: 0; padding: 0; background: var(--bg);
            color: var(--text); font-family: 'Inter', sans-serif;
            overflow-x: hidden; min-height: 100vh;
        }

        /* ЖИВОЙ ФОН */
        .blobs { position: fixed; inset: 0; z-index: -1; }
        .blob { 
            position: absolute; background: var(--accent); 
            filter: blur(100px); opacity: 0.15; border-radius: 50%;
            animation: move 20s infinite alternate; 
        }
        @keyframes move { from { transform: translate(-10%, -10%); } to { transform: translate(30%, 20%); } }

        /* СЕТКА СТРОГО ПО СКЕЛЕТУ */
        .container {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            grid-template-rows: 100px 180px auto 100px;
            gap: 30px; max-width: 1400px; margin: 0 auto; padding: 20px 40px;
        }

        /* КАРТОЧКИ НЕОМОРФИЗМ */
        .card {
            background: var(--bg); border-radius: 35px;
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            padding: 25px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .card:hover { transform: translateY(-10px); box-shadow: 18px 18px 36px var(--shadow-dark); }

        /* Позиции */
        .login { grid-column: 1; grid-row: 1; justify-self: start; width: 160px; height: 60px; font-weight: bold; }
        .theme { grid-column: 3; grid-row: 1; justify-self: end; width: 160px; height: 60px; cursor: pointer; }
        
        .stat { grid-row: 2; border-top: 4px solid var(--accent); }
        .feedback { grid-column: 1 / 3; grid-row: 3; align-items: flex-start; min-height: 450px; }
        .arsenal { grid-column: 3; grid-row: 3; background: linear-gradient(145deg, #e6e9ef, #d1d9e6); }

        /* SVG ИКОНКИ */
        svg { width: 45px; height: 45px; fill: var(--accent); margin-bottom: 10px; }

        /* ФОРМА */
        input, textarea {
            width: 100%; background: var(--bg); border: none; padding: 18px;
            border-radius: 20px; margin: 12px 0;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            box-sizing: border-box; font-size: 16px;
        }

        .btn-send {
            background: var(--accent); color: white; border: none; padding: 15px 40px;
            border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 51, 255, 0.3);
        }
        .btn-send:hover { transform: scale(1.05); filter: brightness(1.2); }

        /* ФУТЕР */
        .footer { grid-column: 1 / 4; grid-row: 4; display: flex; justify-content: space-between; align-items: center; }
        .socials img { width: 40px; margin-left: 15px; transition: 0.3s; }
        .socials img:hover { transform: translateY(-5px) rotate(10deg); }
    </style>
</head>
<body>

<div class="blobs">
    <div class="blob" style="width: 600px; height: 600px; top: -10%; left: -5%;"></div>
    <div class="blob" style="width: 400px; height: 400px; bottom: 10%; right: 10%; background: #00CCFF;"></div>
</div>

<div class="container">
    <div class="card login">РЕГИСТРАЦИЯ</div>
    <div class="card theme" onclick="document.body.style.filter = document.body.style.filter ? '' : 'invert(1) hue-rotate(180deg)'">ТЕМА</div>

    <div class="card stat">
        <svg viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <strong>ОТКЛИК</strong>
    </div>
    <div class="card stat">
        <svg viewBox="0 0 24 24"><path d="M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.41 21.94 12.21 22 12 22C11.79 22 11.59 21.94 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.59 2.06 11.79 2 12 2C12.21 2 12.41 2.06 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5Z"/></svg>
        <strong>СТЭК</strong>
    </div>
    <div class="card stat">
        <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/></svg>
        <strong>ДИНАМИКА</strong>
    </div>

    <div class="card feedback">
        <h2 style="color: var(--accent); margin-top: 0;">ОСТАВИТЬ ОТЗЫВ</h2>
        <input type="text" placeholder="Ваше имя">
        <textarea placeholder="Напишите что-нибудь крутое..." rows="5"></textarea>
        <button class="btn-send">ОТПРАВИТЬ</button>
    </div>

    <div class="card arsenal">
        <h2 style="color: var(--accent);">АРСЕНАЛ</h2>
        <p>• Python / Flask</p>
        <p>• JavaScript / UI</p>
        <p>• Git / GitHub</p>
    </div>

    <div class="footer">
        <div class="card" style="width: 200px; height: 60px; font-weight: bold;">ОБО МНЕ</div>
        <div class="socials">
            <img src="static/assest/wa.png">
            <img src="static/assest/inst.png">
            <img src="static/assest/tg.png">
        </div>
    </div>
</div>

</body>
</html>
